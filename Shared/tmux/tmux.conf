# ── unified tmux config (works on Linux/WSL + Windows/psmux) ──────────────

set -g mouse on
set -s escape-time 0
set -ga terminal-overrides ",xterm-256color*:Tc"
set-option -g default-terminal "xterm-256color"

# ── layout ─────────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-rename off

# ── prefix: C-a (unbind C-b) ──────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── splits ─────────────────────────────────────────────────────────────────
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ── pane navigation (Alt-hjkl, no prefix) ──────────────────────────────────
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ── bells / activity ───────────────────────────────────────────────────────
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ── catppuccin mocha status bar ────────────────────────────────────────────
catppuccin_mocha_sapphire="#74c7ec"
catppuccin_mocha_mauve="#cba6f7"

set -g status-style bg=default
set -g status-style fg=default
set -g status-left "#[fg=${catppuccin_mocha_mauve}, bold] #S #[fg=default, nobold] | "
set -g status-left-length 250
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=${catppuccin_mocha_sapphire}] #I:#W🔵"
set-option -g status-right " | #H"

# ── vi copy mode (the "y to copy" binding is OS-specific: xclip on Linux) ──
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── reload config ──────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf

# ── OS-specific overrides (clipboard, default-shell, WORKTREE_ROOT) ────────
%if '#{>=:#{version},3.2}'
  if-shell 'test -f /etc/os-release' \
    'source-file ~/.tmux.linux.conf' \
    'source-file ~/.tmux.windows.conf'
%else
  source-file ~/.tmux.linux.conf
%endif

# ── bindings (safe after OS block) ─────────────────────────────────────────

# old Primeagen sessionizer (ad-hoc ~/code directories)
bind-key -r f run-shell "bash ~/.local/scripts/tmux-sessionizer"
bind-key -r i run-shell "bash ~/.local/scripts/tmux-cht.sh"
bind-key -r g run-shell "bash ~/.local/scripts/gitmoji_selector.sh"
bind-key -r M run-shell "bash ~/.local/scripts/tmux-sessionizer ~/code/Machine_Setups"

# worktree picker (<leader>w → fzf popup: switch / checkout / clone)
bind-key -r w display-popup -E -w 90% -h 90% "bash ~/.local/scripts/worktree/tmux-worktree.sh"
