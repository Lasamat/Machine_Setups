# ── Linux / WSL overrides ──────────────────────────────────────────────────

set-environment -g WORKTREE_ROOT "$HOME/Repository/Worktrees"

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# worktree picker (<prefix>w → fzf popup: switch / checkout / clone)
# `~` expands to a forward-slash path here (real tmux); the psmux-specific
# Windows variant lives in tmux.windows.conf.
bind-key w display-popup -E -w 90% -h 90% "bash ~/.local/scripts/worktree/tmux-worktree.sh"

# old Primeagen sessionizer (ad-hoc ~/code directories) — real tmux supports
# `-r` (repeat: tap again within repeat-time without re-pressing the prefix).
bind-key -r f run-shell "bash ~/.local/scripts/tmux-sessionizer"
bind-key -r i run-shell "bash ~/.local/scripts/tmux-cht.sh"
bind-key -r g run-shell "bash ~/.local/scripts/gitmoji_selector.sh"
bind-key -r M run-shell "bash ~/.local/scripts/tmux-sessionizer ~/code/Machine_Setups"